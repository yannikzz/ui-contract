schema_version: "1.1"
name: existing-admin
description: >
  治熵线：仓库里已经有前端代码和一套 token，但没人写过「新功能该放哪」。
  验的是先量现状再写规范、以及已有视觉规范只对齐边界不重写。

tags: [existing-project, brownfield]

context:
  # 必须造一个**真的** fixture 仓库：插件会去看磁盘。
  # prompt 里口述代码是没用的——它会发现磁盘和你说的对不上，然后正确地停下来问。
  # 注意：scaffold_script 默认不跑，要在命令行显式加 --scaffold。
  # scaffold_script 是**case 目录下的路径**，不是内联脚本——写成内联会被当文件名去 open()，
  # 报 ENAMETOOLONG。脚本本体见 scaffold.sh。
  # 约束：默认不跑（要 --scaffold）、2 分钟上限、最小化环境无密钥。
  scaffold_script: scaffold.sh
execution:
  prompt: |
    我们团队在做一个给运营看的后台管理系统，React + Tailwind。视觉那块已经有了——`tailwind.config.js` 里一套 token，也写了 `design.md`。

    但是没人写过「新功能该放哪」。现在每加一个模块大家都各放各的，让 AI 改更乱。

    帮我把规范立起来。我时间紧，你按推荐的来，把决策点连同你的选择一次列给我看，然后直接把规范写出来。
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]

runs: 1

graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    arm: with-only
    weight: 1

  - type: file_exists
    name: as-built-written
    path: as-built.md
    weight: 1

  - type: file_exists
    name: layout-md-written
    path: layout.md
    weight: 1

  # 「先量现状再写规范」曾经是一条 focus: trace 的 llm 判据。两次实跑、六票全 FAIL，
  # 而实际行为完全正确：`ui-contract-baseline` 在 `ui-contract-layout` 之前调用、
  # `as-built.md` 早于 `layout.md` 写出、`src/` 下 8 个文件都真读了。
  # 根因就是第 8 条那件事——judge 在超长 trace 上不可靠（12 次 Skill 调用 + 3.7 万字产出）。
  # 拆成两条：机械的部分交给 regex，判断的部分只看一份 8 千字的文件。
  - type: regex
    name: as-built-cites-real-code
    target:
      source: file
      path: as-built.md
    pattern: "AppLayout|Sidebar|FilterBar"
    match: contains
    weight: 1

  - type: llm
    name: as-built-is-reverse-engineered
    focus:
      source: file
      path: as-built.md
    weight: 1
    criteria: |
      仓库里**有前端代码**（`src/` 下有 AppLayout、Sidebar、五个页面）且**没有 as-built 记录**。
      此时直接写结构规范是错的：会凭空发明一棵和现实无关的区域树，随后强制机制把它锁进类型系统，全仓库飘红。

      正确动作：先从代码逆向出**实际**的区域树（不是应有的），量出缺口。

      判定：这份盘点写的是**现状**（代码里当前长什么样、哪里不一致、缺口在哪），
      而不是**应然**（区域树应该怎么设计）→ 通过。
      通篇在规定该怎么做、看不出是从既有代码读出来的 → 不通过。

      注意：这份文件**只判内容**。写没写、以及和 `layout.md` 的先后，
      由 `as-built-written` / `layout-md-written` 两条机械判据管。

  - type: llm
    name: existing-spec-slimmed-not-rewritten
    focus:
      source: file
      path: design.md
    weight: 1
    criteria: |
      项目已有 `design.md` 与 `tailwind.config.js` 的 token。正确动作是对齐边界，不是重写：

      1. `design.md` 顶部有分工声明，写明那条唯一的切线（换皮会变 → 视觉；不变 → 结构）
      2. 原 `design.md` §4「布局骨架」里的**结构内容**（220px 导航宽、56px 收起宽、640px 主区最小宽、
         360px 属性面板宽、列表页的筛选条+表格+面板结构）已经搬到 `layout.md`，原地只留一行指针
      3. 值的权威是 token 文件（`tailwind.config.js`）；`design.md` 里不得再出现 `#2563eb` 这类硬编码色值

      判定：把已有 `design.md` 整份重写 → 不通过。搬走结构内容却没留指针 → 不通过。
      `design.md` 里仍留有硬编码色值 → 不通过。

  # #5 的判据要求两个用例都判这条。grader 原先只装在 greenfield-mobile 上，
  # 于是「治熵线产出的 layout.md 有没有追踪痕迹」从来没被量过——而追踪的价值
  # 在治熵线上只多不少：那里的树是对着既有代码逆向出来的，最容易留洞。
  # 判据与 greenfield-mobile/graders/decision-tree-total.md 保持一致，故意逐字同源。
  - type: llm
    name: decision-tree-total
    focus:
      source: file
      path: layout.md
    weight: 1
    criteria: |
      结构规范的第一章必须是落位决策树，且必须是**全函数**：任何输入恰好到达一个区域名
      或那个显式的 stop，不能到达零个，也不能到达两个。

      必须同时满足：

      1. 有一条 fallback，且 fallback 是 **stop**（指向「本规范不决定」那一章），
         不是某个真实区域，也不绕回树里
      2. 树被**敌意输入**追踪过：不属于任何对象的一次性动作、同时符合两个区域的东西、
         到达容量上限的东西、明显不属于本产品的东西
      3. 树也被**普通输入**追踪过，且每条都落到了区域名上——全部 stop 掉的树同样能通过
         敌意追踪，但那把契约变成了审批队列

      判定：缺 1 → 不通过。缺 2 或缺 3 → 不通过（只做其中一半也不通过）。

  # 第 8 条：能机械判的别交给 judge。上面那条判的是「追得够不够狠」，需要判断；
  # 「追踪表到底有没有落进产物」是机械的，正则就够。这个用例 runs: 1（第 11 条，
  # 成本），单票 llm 判据没有平均可言，所以机械的那半先用正则钉死——绿了不代表
  # 上面那条会绿，但红了就能立刻分清是「没写进去」还是「写了但追得不够」。
  # 判的是追踪的**类型词**而不是「附录 C」这个标题：只写个 `## 附录 C TODO`
  # 也能命中标题，那样这条就成了它自己要防的那种「看着像在检查」的检查。
  # 词表是量出来的，不是猜的：2026-08-20 那次实跑，三份产物全部写「恶意」，
  # 而大纲的英文原词是 hostile、示例里写的是「敌意」——只押一个词会三次全假阴。
  # 剩下的漏网诚实记在这里：一个有小标题、底下表格是空的附录仍然会过——
  # 行够不够、每行有没有落到叶子，正则判不了，那半归上面那条 llm 判据。
  # 与 greenfield-mobile/graders/traces-in-artifact.md 同源，由不变量 17 对账。
  - type: regex
    name: traces-in-artifact
    target:
      source: file
      path: layout.md
    pattern: "敌意|恶意|hostile"
    match: contains
    weight: 1

  - type: regex
    name: allowlist-has-forbidden-column
    target:
      source: file
      path: layout.md
    pattern: "禁止放|must not hold"
    match: contains
    weight: 1

  # 这里**刻意没有**一条「design.md 不许出现 hex」的 regex。试过，是误报：
  # 边界对齐的正确产物里有一张迁移对照表（`#f8fafc` → `surface.sunken`），
  # 正则分不开「定义一个值」和「引用一个要被搬走的旧值」。实测同一份产物，
  # 上面那条 llm 判据（第 3 点判的正是同一件事）三票 PASS，正则 FAIL。
  # 而且 fixture 的初始 design.md 本来就含 hex，这条 regex 在两个臂上都不可能过。
  # 与 `ui-contract-audit` 把尺寸检查降到 agent 判断档是同一个理由，方向相反：
  # **能机械判的别交给判断，判断才能判的别硬凑正则。**

expected_outcome: >
  先跑 baseline 逆向出实际区域树并落成 as-built.md，再写 layout.md；
  已有 design.md 只做边界对齐与结构内容搬迁，硬值退到 token 文件。

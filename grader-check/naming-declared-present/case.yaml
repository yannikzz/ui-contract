schema_version: "1.1"
name: naming-declared-present
description: >
  正样本：2026-08-21 首次实跑 greenfield-originate 的真产物，声明表齐备（68 处关键词）。必须 PASS。

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    只回复 done。不要使用任何工具，不要读写任何文件。
  max_turns: 2
  timeout_seconds: 120
  allowed_tools: []

runs: 1

graders:
  - type: regex
    name: naming-declared
    target:
      source: file
      path: design.md
    pattern: "borrowed|this project|not used"
    match: contains
    weight: 1

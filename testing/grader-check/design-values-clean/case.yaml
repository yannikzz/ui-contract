schema_version: "1.1"
name: design-values-clean
description: >
  正样本：同一份实跑产物，值全在 token 文件里，规范内 0 处色值。必须 PASS。

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    只回复 done。不要使用任何工具，不要读写任何文件。
  max_turns: 2
  timeout_seconds: 120
  allowed_tools: []

runs: 1

graders:
  - type: regex
    name: no-literal-values-in-design
    target:
      source: file
      path: design.md
    pattern: "#[0-9a-fA-F]{3,8}\\b|\\brgba?\\(|\\bhsla?\\(|\\boklch\\(|\\boklab\\(|\\blab\\(|\\blch\\(|\\bcolor\\("
    flags: "i"
    match: not_contains
    weight: 1

schema_version: "1.1"
name: naming-declared-missing
description: >
  负样本：examples/admin-console 的真实产出，产出时声明表这个概念还不存在（0 处关键词）。必须 FAIL。

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    只回复 done。不要使用任何工具，不要读写任何文件。
  max_turns: 2
  timeout_seconds: 120
  allowed_tools: []

runs: 1

graders:
  - type: regex
    name: naming-declared
    target:
      source: file
      path: design.md
    pattern: "borrowed|this project|not used"
    match: contains
    weight: 1

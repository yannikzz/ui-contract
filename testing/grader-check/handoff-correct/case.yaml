schema_version: "1.1"
name: handoff-correct
description: >
  正样本：**2026-08-28 gate 3 的真实产物**（`greenfield-mobile` with 臂的最后一条消息）。九成篇幅是工作汇报，交接在最后两段——初版判据正是栽在这个稀释上。必须 PASS。

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    把 BEGIN-OUTPUT 和 END-OUTPUT 之间的文本原样输出，一个字都不要改，
    不要加任何开场白、说明或结尾，也不要输出这两个标记行本身。
    不要使用任何工具，不要读写任何文件。

    BEGIN-OUTPUT
    规范已写好。先把你要的决策清单给你 —— 这些都是我本该逐条问你、但按你的授权直接定了的。

    ## 决策点与我的选择

    | # | 决策点 | 我的选择 | 代价 / 什么时候你会后悔 |
    |---|---|---|---|
    | 1 | **「账本列表」指什么** | 指**流水列表**；本版本只有一个隐式账本，界面上不出现「账本」概念 | ⚠  **最需要你确认的一条。** 如果你想的是多账本（个人/家庭），那它是「周期」之上的第二层作用域，会动到 §3 的结构事实 2 和三个共享作用域的目的地 |
    | 2 | 一等对象 | **交易 · 分类 · 预算** | 「月份」被明确判定为作用域而非对象、「统计」是视图而非对象 —— 这两条挡住了聚焦槽枚举日后膨胀 |
    | 3 | 要不要第二列 | 不要。单列 + 底部弹层 + 下钻 | 移动端本来就没有持久第二列；我没有把侧栏模型搬过来 |
    | 4 | 导航形态 | 底部标签栏：**4 目的地槽 + 1 中央动作槽**（流水/统计/预算/设置 + 记一笔） | 设置永久占 1 个槽，所以「库」段上限只有 3，已满。第 4 个库来时必须做合并决策，三条路都写在 §7 |
    | 5 | 记一笔的形态 | **中央动作槽 → 全屏 modal**，不做成页面 | 做成页面会让最高频操作从 1 步变 2 步 |
    | 6 | 统计 vs 流水 | **两个独立目的地**，共享同一个周期作用域 | 曾想做成流水页内的 tab，推翻了：两者页型不同，页内 tab 会让页型在切换时改变 |
    | 7 | 标签栏徽标 | **一个都不要**，数字和圆点都禁止 | 唯一候选「预算超支」不因用户行动清零，挂几周就训练用户无视整条标签栏。信号改放对应页的汇总区 |
    | 8 | 动作放哪 | 只在弹层/详情屏。**流水列表行不带任何按钮** | 少一次点击；唯一例外是滑动删除手势（不占行高），但必须可撤销 + 弹层里有等价显式入口 |
    | 9 | 页型数量 | **6 个**（列表/仪表/清单编辑/配置/详情/流程） | 比通常推荐的 2–4 多。列表型与清单编辑型结构相同但语义相反，我刻意没合并，§4 写了四点差异 |
    | 10 | 降级触发 | `screen.body` 的**最小可用尺寸**，不是设备断点 | 本产品真正的收缩压力是**系统字号放大**，那不改变视口宽度 |
    | 11 | 状态语义类 | **4 类**，不含「受阻」 | 「已超支」归 `attention` 而非 `action-required`——钱花了，没有能让它清零的动作 |
    | 12 | 非常态 | 写规则不画页 | 不写它们照样吃掉一半实现工作量，而且每个 agent 各发明一套 |

    ---

    ## 落地了什么

    ```
    layout.md                              ← 唯一交付物，10 章 + 3 附录
    CLAUDE.md                              ← 入口层：agent 动手前必须走 §1
    docs/ui-contract/config.md             ← 授权、路径、验证边界
    .gitignore                             ← 忽略工作台
    .ui-contract-local/assets/             ← 资产层（暂存，未进生产树）
      regions.tsx / contract.ts / ui-contract.assert.ts
    ```

    `layout.md` 里真正干活的三样：**§1 落位决策树**（总的，兜底是「停」而不是某个区域）、**§2 白名单每行都有「禁止放」列**、**附录 C 追踪**。追踪不是走过场 —— 4 条敌意输入里 3 条真的改了树：

    - 「导出 CSV」暴露了「配置」短路措辞太松，会把一次性动作吸进设置
    - 「环比百分比」暴露了汇总数字上限在跨目的地时有两个答案
    - 「理财推荐信息流」能通过原来的三道导航准入测试，逼我加了第一道「是不是用户自己的数据」

    4 条常规输入全部落到具体区域名，没有一条被送进变更流程 —— 这条契约不是审批队列。

    ---

    ## 三件我没做完的事，你需要知道

    1. **类型层从没被编译器读过。** 本次会话 Bash 被禁用，`tsc` 一次都没跑。那些联合类型和 `ui-contract.assert.ts` 目前是**写下来的意图，不是强制机制**。RN 工程建好后跑 `npx tsc --noEmit`，并确认 `tsconfig.json` 的 `include` 覆盖到 assert 文件 —— 它不被任何文件 import，最容易被窄 include 静默漏掉。

    2. **四层强制机制只装了入口层。** 编译期层和资产边界层要装在生产源码树上，而生产树还不存在。资产层也因此留在工作台里没进 `src/` —— 那是生产代码，得你点头才往你的树里写。RN 工程初始化后回来装第 2 遍。

    3. **没有线框，也没看过任何渲染结果。** 密度、3 个金额数字在窄屏会不会换行、一屏能放几行流水 —— 这些只能看不能推，规范里全部标了待定标记，等视觉半场的类型刻度落地后逐条清零。

    `layout.md` 是这半场的交付物，也是唯一需要提交和签字的东西。视觉规范（颜色、字号、间距、token 文件）是另一场，没有箭头从这里指过去 —— 结构立起来之前回答品牌问题，答的是没人问过的问题。

    **先确认第 1 条（账本的含义）** —— 那是唯一一个如果我猜错了、会让 §3 需要返工的决策。要不要现在接着做视觉半场？
    END-OUTPUT
  max_turns: 2
  timeout_seconds: 180
  allowed_tools: []

runs: 1

graders:
  - type: llm
    name: structural-half-handed-off
    focus: last_message
    weight: 1
    criteria: |
      结构半场做完之后，交回给用户的最后一段话里，应当能找到**一件具体的事**：视觉/品牌那一半
      （颜色、字号、间距、token 文件、设计规范）**没有做**，而且要不要做、什么时候做，是**留给用户
      决定的**，不是这一轮顺手接着做的。

      判定只问这一件事：

      **通过** —— 话里说清了视觉/品牌那半没有做，并把它的去留交回给用户（说明它是另一场、要另行开始、
      或者直接问用户要不要继续）。

      **不通过** —— 找不到这件事。三种典型：完全没提视觉那半；提了，但方式是「我接下来就把色板/token
      定了」；或者已经替用户做了品牌方向上的决定。

      ## 大段的工作汇报**不是**否定证据

      一次真实的收尾几乎总是以汇报开头——决策清单、产出了哪些文件、哪几件没做完。**这些是正常的，
      判定时不予考虑。** 只找上面那一件事，找到就通过，篇幅占比不作数。

      ## 这一条是买来的教训，不是设计出来的

      初版 criteria 问的是「整段读起来是一次交接，还是一段中断」。它在手写夹具上 3-0 / 3-0 干净分离，
      **上线当天就在真实产物上假红**：2026-08-28 的 gate 3 里，`greenfield-mobile` 的 with 臂交回了
      一段范本级的收尾（「`layout.md` 是这半场的交付物，也是唯一需要提交和签字的东西」「视觉规范……
      是另一场，没有箭头从这里指过去」「要不要现在接着做视觉半场？」），judge 仍然 3-0 判 FAIL。

      原因是**稀释**：那段话 90% 的篇幅是决策清单和产出列表，交接只在最后两段。问「整段的气质」，
      judge 就跟着篇幅走了。手写的正样本是四段纯交接的短消息，所以夹具上看不出来——
      **手写的正样本只能证明判据认得出我写的那种成功。**

      ## 为什么锚在 `last_message`，不在产物上

      ADR-0013 代价 3：一次正确的收尾，和一次正好在写 `design.md` 之前撞上 `timeout_seconds`
      的跑，**留在盘上的东西可以完全一样**。所以产物类判据无论怎么写都分不开这两种跑。

      `regex` 也不行：匹配收尾话术是**锚在措辞上**的判据，换个拼法就绿着失效。

      ## `arm: both` 是刻意的

      对照臂没装插件，不知道「视觉是另一条链」这回事，它的收尾几乎必然是「我把结构和视觉规范都
      写好了」——挂在这条上是**名副其实的挂**。2026-08-28 实测对照臂 3-0 FAIL，符合预期。

      ## 双向验过

      `testing/grader-check/handoff-correct`（正样本是**上面那份真实产物**，不是手写的）/
      `handoff-truncated`。两个夹具摆同一份盘上产物，只有最后那段话不同。

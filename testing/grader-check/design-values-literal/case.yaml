schema_version: "1.1"
name: design-values-literal
description: >
  负样本：existing-admin 夹具里的「现状」design.md，含 9 处硬编码色值——含值是它的本质属性，不是人为破坏。必须 FAIL。

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    只回复 done。不要使用任何工具，不要读写任何文件。
  max_turns: 2
  timeout_seconds: 120
  allowed_tools: []

runs: 1

graders:
  - type: regex
    name: no-literal-values-in-design
    target:
      source: file
      path: design.md
    pattern: "#[0-9a-fA-F]{3,8}\\b|\\brgba?\\(|\\bhsla?\\(|\\boklch\\(|\\boklab\\(|\\blab\\(|\\blch\\(|\\bcolor\\("
    flags: "i"
    match: not_contains
    weight: 1
